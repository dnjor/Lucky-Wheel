<script>
(() => {
  "use strict";

  const ACTIVE_KEY = "premium-wheel-active-session-v2";
  const SOUND_KEY = "premium-wheel-sound-v1";
  const TAU = Math.PI * 2;
  const SESSION_TITLES = ["الجلسة الأولى", "الجلسة الثانية", "الجلسة الثالثة"];
  const PALETTE = [
    ["#6d5ce8", "#5142bd"], ["#2eb9ad", "#1e8d89"], ["#e1a73b", "#b97720"],
    ["#d8547b", "#a93c61"], ["#397fc7", "#285b9b"], ["#9b58c7", "#713d9f"],
    ["#e46f45", "#b64c2b"], ["#39a967", "#267c4d"], ["#5665d9", "#3f47a8"],
    ["#c65d9a", "#963e74"], ["#23a3c1", "#177993"], ["#b98b36", "#8d6424"]
  ];

  const $ = (selector) => document.querySelector(selector);
  const canvas = $("#wheelCanvas");
  const ctx = canvas.getContext("2d");
  const wheelStage = $("#wheelStage");
  const emptyState = $("#emptyState");
  const spinButton = $("#spinButton");
  const spinHub = $("#spinHub");
  const addForm = $("#addForm");
  const nameInput = $("#nameInput");
  const formMessage = $("#formMessage");
  const participantList = $("#participantList");
  const participantCount = $("#participantCount");
  const listBadge = $("#listBadge");
  const resetButton = $("#resetButton");
  const soundToggle = $("#soundToggle");
  const winnerModal = $("#winnerModal");
  const winnerName = $("#winnerName");
  const winnerImage = $("#winnerImage");
  const keepButton = $("#keepButton");
  const removeWinnerButton = $("#removeWinnerButton");
  const toast = $("#toast");
  const celebrationCanvas = $("#celebrationCanvas");
  const celebrationCtx = celebrationCanvas.getContext("2d");
  const sessionTabs = [...document.querySelectorAll(".session-tab")];
  const imagePickerButton = $("#imagePickerButton");
  const imageInput = $("#imageInput");
  const pendingImage = $("#pendingImage");
  const pendingImagePreview = $("#pendingImagePreview");
  const clearPendingImageButton = $("#clearPendingImage");

  let sessions = emptySessions();
  let activeSessionIndex = loadActiveSession();
  let rotations = [0, 0, 0];
  let rotation = rotations[activeSessionIndex];
  let isSpinning = false;
  let selectedIndex = null;
  let lastTickSegment = null;
  let toastTimer = null;
  let messageTimer = null;
  let audioContext = null;
  let confettiFrame = null;
  let pendingImageBlob = null;
  let pendingImageUrl = null;
  let imageTargetIndex = null;
  let isProcessingImage = false;
  let cloudReady = false;
  let cloudWriteCount = 0;
  let saveQueue = Promise.resolve();
  const imageCache = new Map();
  const imageLoads = new Map();

  let soundEnabled = true;
  try { soundEnabled = localStorage.getItem(SOUND_KEY) !== "off"; } catch { /* use default */ }

  function createId(prefix = "item") {
    const value = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    return `${prefix}-${value}`;
  }

  function makeItem(name = "", imageId = null) {
    return { id: createId(), name: String(name).trim(), imageId };
  }

  function emptySessions() {
    return SESSION_TITLES.map((title, index) => ({ id: `session-${index + 1}`, title, items: [] }));
  }

  function loadActiveSession() {
    try {
      const value = Number(localStorage.getItem(ACTIVE_KEY));
      return Number.isInteger(value) && value >= 0 && value < 3 ? value : 0;
    } catch { return 0; }
  }

  function serverCall(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => reject(new Error(error?.message || "تعذر الاتصال بخدمة الحفظ.")));
      runner[functionName](...args);
    });
  }

  function normalizeCloudSessions(input) {
    if (!Array.isArray(input) || input.length !== 3) return emptySessions();
    return input.map((session, index) => ({
      id: `session-${index + 1}`,
      title: SESSION_TITLES[index],
      items: Array.isArray(session?.items) ? session.items
        .filter((item) => item && (String(item.name || "").trim() || item.imageId))
        .map((item) => ({
          id: typeof item.id === "string" && item.id ? item.id : createId(),
          name: String(item.name || "").trim().slice(0, 40),
          imageId: typeof item.imageId === "string" && item.imageId ? item.imageId : null
        })).slice(0, 120) : []
    }));
  }

  async function loadCloudData() {
    try {
      const result = await serverCall("getAppData");
      sessions = normalizeCloudSessions(result?.sessions);
      cloudReady = true;
      renderAll();
    } catch (error) {
      showToast(error?.message || "تعذر تحميل البيانات المحفوظة.");
      renderAll();
    }
  }

  function saveSessions() {
    const snapshot = JSON.parse(JSON.stringify(sessions));
    cloudWriteCount += 1;
    renderAll();
    const operation = saveQueue
      .catch(() => undefined)
      .then(() => serverCall("saveSessions", snapshot));
    saveQueue = operation;
    return operation.finally(() => {
      cloudWriteCount = Math.max(0, cloudWriteCount - 1);
      renderAll();
    });
  }

  const activeItems = () => sessions[activeSessionIndex].items;

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
      reader.onerror = () => reject(new Error("تعذر قراءة الصورة."));
      reader.readAsDataURL(blob);
    });
  }

  async function putImage(blob) {
    const base64 = await blobToBase64(blob);
    const result = await serverCall("uploadImage", { base64, mimeType: blob.type });
    if (!result?.id) throw new Error("لم تُرجع خدمة التخزين معرّفًا للصورة.");
    return result.id;
  }

  function releaseCachedImage(id) {
    const cached = imageCache.get(id);
    if (cached?.url?.startsWith("blob:")) URL.revokeObjectURL(cached.url);
    imageCache.delete(id);
    imageLoads.delete(id);
  }

  async function deleteImage(id) {
    if (!id) return;
    releaseCachedImage(id);
    await serverCall("deleteImage", id);
  }

  function ensureImage(id) {
    if (!id) return null;
    if (imageCache.has(id)) return imageCache.get(id);
    if (imageLoads.has(id)) return null;
    const task = serverCall("getImageData", id).then((url) => {
      if (!url) return null;
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve({ image, url });
        image.onerror = () => reject(new Error("Decode failed"));
        image.src = url;
      });
    }).then((entry) => {
      if (entry) imageCache.set(id, entry);
      imageLoads.delete(id);
      drawWheel();
      renderParticipantList();
      return entry;
    }).catch(() => { imageLoads.delete(id); return null; });
    imageLoads.set(id, task);
    return null;
  }

  function loadImageElement(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const image = new Image();
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("صيغة الصورة غير مدعومة.")); };
      image.src = url;
    });
  }

  async function normalizeImage(file) {
    if (!file?.type.startsWith("image/")) throw new Error("اختر ملف صورة صالحًا.");
    if (file.size > 12 * 1024 * 1024) throw new Error("الصورة أكبر من 12 MB.");
    const image = await loadImageElement(file);
    const width = image.naturalWidth;
    const height = image.naturalHeight;
    const size = Math.min(width, height);
    const output = document.createElement("canvas");
    output.width = output.height = 512;
    const outputCtx = output.getContext("2d", { alpha: false });
    outputCtx.fillStyle = "#11162c";
    outputCtx.fillRect(0, 0, 512, 512);
    outputCtx.drawImage(image, (width - size) / 2, (height - size) / 2, size, size, 0, 0, 512, 512);
    const webp = await new Promise((resolve) => output.toBlob(resolve, "image/webp", 0.84));
    if (webp) return webp;
    const jpeg = await new Promise((resolve) => output.toBlob(resolve, "image/jpeg", 0.86));
    if (!jpeg) throw new Error("تعذر تجهيز الصورة.");
    return jpeg;
  }

  function randomInt(max) {
    if (max <= 1) return 0;
    if (globalThis.crypto?.getRandomValues) {
      const maximum = 0x100000000;
      const limit = maximum - (maximum % max);
      const values = new Uint32Array(1);
      do globalThis.crypto.getRandomValues(values); while (values[0] >= limit);
      return values[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  const normalizeAngle = (angle) => ((angle % TAU) + TAU) % TAU;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(globalThis.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(rect.width * dpr));
    const height = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    drawWheel();
  }

  function clippedText(text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    let value = text;
    while (value.length > 1 && ctx.measureText(`${value}…`).width > maxWidth) value = value.slice(0, -1);
    return `${value}…`;
  }

  function drawImageCover(image, x, y, width, height) {
    const sourceWidth = image.naturalWidth;
    const sourceHeight = image.naturalHeight;
    const targetRatio = width / height;
    const sourceRatio = sourceWidth / sourceHeight;
    let sx = 0, sy = 0, sw = sourceWidth, sh = sourceHeight;
    if (sourceRatio > targetRatio) { sw = sourceHeight * targetRatio; sx = (sourceWidth - sw) / 2; }
    else { sh = sourceWidth / targetRatio; sy = (sourceHeight - sh) / 2; }
    ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
  }

  function drawSegmentImage(image, start, end, arc, radius, count) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.closePath();
    ctx.clip();

    const mid = start + arc / 2;
    const radialPosition = count === 1 ? 0 : radius * 0.5;
    const halfArc = Math.min(arc / 2, Math.PI / 2);
    const pictureSize = count === 1
      ? radius * 2
      : Math.max(
        radialPosition,
        radius - radialPosition,
        radius * Math.sin(halfArc)
      ) * 2.04;

    if (count > 1) {
      // Keep the square crop fixed to its slice. The top of the photo (the
      // head) points inward, while the bottom (the feet) points outside.
      ctx.rotate(mid);
      ctx.translate(radialPosition, 0);
      ctx.rotate(-Math.PI / 2);
    }

    // This is the canvas equivalent of CSS `object-fit: cover`.
    drawImageCover(image, -pictureSize / 2, -pictureSize / 2, pictureSize, pictureSize);
    ctx.restore();
  }

  function drawWheel() {
    const width = canvas.width;
    const height = canvas.height;
    const dpr = Math.min(globalThis.devicePixelRatio || 1, 2);
    const cssSize = Math.min(width, height) / dpr;
    const centerX = width / 2;
    const centerY = height / 2;
    const radius = Math.min(width, height) * 0.485;
    const items = activeItems();
    ctx.clearRect(0, 0, width, height);
    emptyState.hidden = items.length > 0;

    if (!items.length) {
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, TAU);
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      gradient.addColorStop(0, "#171d39");
      gradient.addColorStop(1, "#0e1328");
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 2 * dpr;
      ctx.stroke();
      return;
    }

    const count = items.length;
    const arc = TAU / count;
    const fontSize = Math.max(10, Math.min(18, cssSize * (count > 30 ? 0.025 : count > 18 ? 0.03 : 0.036))) * dpr;
    const textRadius = radius * (count > 24 ? 0.67 : 0.62);
    const maxTextWidth = count <= 2 ? radius * 0.62 : Math.min(radius * 0.48, Math.max(radius * 0.18, arc * textRadius * 0.82));

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(rotation);
    items.forEach((item, index) => {
      const start = index * arc;
      const end = start + arc;
      const colors = PALETTE[index % PALETTE.length];
      const fill = ctx.createRadialGradient(0, 0, radius * 0.1, 0, 0, radius);
      fill.addColorStop(0, colors[1]);
      fill.addColorStop(1, colors[0]);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();

      const cached = item.imageId ? (imageCache.get(item.imageId) || ensureImage(item.imageId)) : null;
      if (cached?.image) drawSegmentImage(cached.image, start, end, arc, radius, count);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = Math.max(1.2, 1.5 * dpr);
      ctx.stroke();

      if (item.name) {
        const mid = start + arc / 2;
        ctx.save();
        ctx.rotate(mid);
        ctx.translate(textRadius, 0);
        if (Math.cos(mid) < 0) ctx.rotate(Math.PI);
        ctx.font = `700 ${fontSize}px Tahoma, Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.direction = "rtl";
        const label = clippedText(item.name, maxTextWidth);
        const labelWidth = Math.min(ctx.measureText(label).width, maxTextWidth);
        if (cached?.image) {
          const pad = 8 * dpr;
          ctx.fillStyle = "rgba(5,7,16,.66)";
          ctx.beginPath();
          if (typeof ctx.roundRect === "function") {
            ctx.roundRect(-labelWidth / 2 - pad, -fontSize * 0.76, labelWidth + pad * 2, fontSize * 1.52, 7 * dpr);
          } else {
            ctx.rect(-labelWidth / 2 - pad, -fontSize * 0.76, labelWidth + pad * 2, fontSize * 1.52);
          }
          ctx.fill();
        }
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(0,0,0,.5)";
        ctx.shadowBlur = 3 * dpr;
        ctx.fillText(label, 0, 0, maxTextWidth);
        ctx.restore();
      }
    });
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.965, 0, TAU);
    ctx.strokeStyle = "rgba(255,255,255,.2)";
    ctx.lineWidth = 3 * dpr;
    ctx.stroke();
    const inner = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.24);
    inner.addColorStop(0, "rgba(255,255,255,.15)");
    inner.addColorStop(1, "rgba(0,0,0,.18)");
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.205, 0, TAU);
    ctx.fillStyle = inner;
    ctx.fill();
    ctx.restore();
  }

  function formatCount(count) {
    if (!count) return "لا عناصر";
    if (count === 1) return "عنصر واحد";
    if (count === 2) return "عنصران";
    if (count <= 10) return `${count} عناصر`;
    return `${count} عنصرًا`;
  }

  const displayName = (item, index) => item.name || `صورة ${index + 1}`;

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[character]);
  }

  function renderSessionTabs() {
    sessionTabs.forEach((tab, index) => {
      const active = index === activeSessionIndex;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-pressed", String(active));
      tab.querySelector("small").textContent = formatCount(sessions[index].items.length);
      tab.disabled = isSpinning || !cloudReady || cloudWriteCount > 0;
    });
  }

  function renderParticipantList() {
    const items = activeItems();
    const controlsDisabled = isSpinning || !cloudReady || cloudWriteCount > 0;
    if (!items.length) {
      participantList.innerHTML = '<div class="list-empty"><strong>الجلسة فارغة</strong><span>أضف اسمًا أو صورة من الأعلى.</span></div>';
      return;
    }
    participantList.innerHTML = items.map((item, index) => {
      const label = escapeHTML(displayName(item, index));
      const color = PALETTE[index % PALETTE.length][0];
      const cached = item.imageId ? (imageCache.get(item.imageId) || ensureImage(item.imageId)) : null;
      const lead = cached?.url
        ? `<img class="participant-item__thumb" src="${cached.url}" alt="" />`
        : `<span class="participant-item__number">${String(index + 1).padStart(2, "0")}</span>`;
      return `<div class="participant-item" role="listitem" style="--item-color:${color}">
        ${lead}<span class="participant-item__name" title="${label}">${label}</span>
        <button class="participant-item__image" type="button" data-image-index="${index}" aria-label="${item.imageId ? "تغيير" : "إضافة"} صورة ${label}" ${controlsDisabled ? "disabled" : ""}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l1.5-2h5L16 8h4v11H4V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="participant-item__delete" type="button" data-delete-index="${index}" aria-label="حذف ${label}" ${controlsDisabled ? "disabled" : ""}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></svg>
        </button></div>`;
    }).join("");
  }

  function renderAll() {
    const count = activeItems().length;
    const controlsDisabled = !cloudReady || cloudWriteCount > 0;
    participantCount.textContent = String(count);
    listBadge.textContent = formatCount(count);
    spinButton.disabled = controlsDisabled || isSpinning || !count;
    spinHub.disabled = controlsDisabled || isSpinning || !count;
    resetButton.disabled = controlsDisabled || isSpinning || !count;
    imagePickerButton.disabled = controlsDisabled || isSpinning || isProcessingImage;
    soundToggle.setAttribute("aria-pressed", String(soundEnabled));
    soundToggle.setAttribute("aria-label", soundEnabled ? "إيقاف الصوت" : "تشغيل الصوت");
    renderSessionTabs();
    renderParticipantList();
    drawWheel();
  }

  function showFormMessage(message, success = false) {
    clearTimeout(messageTimer);
    formMessage.textContent = message;
    formMessage.classList.toggle("success", success);
    if (message) messageTimer = setTimeout(() => { formMessage.textContent = ""; formMessage.classList.remove("success"); }, 3200);
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add("show");
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function clearPendingImage() {
    pendingImageBlob = null;
    if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
    pendingImageUrl = null;
    pendingImagePreview.removeAttribute("src");
    pendingImage.hidden = true;
    imageInput.value = "";
  }

  async function addItem(rawName) {
    const name = rawName.trim().replace(/\s+/g, " ");
    if (!name && !pendingImageBlob) return showFormMessage("أضف اسمًا أو اختر صورة أولًا.");
    if (activeItems().length >= 120) return showFormMessage("وصلت هذه الجلسة إلى الحد الأقصى: 120 عنصرًا.");
    if (name && activeItems().some((item) => item.name.toLocaleLowerCase("ar") === name.toLocaleLowerCase("ar"))) {
      showFormMessage("هذا الاسم موجود بالفعل في الجلسة.");
      nameInput.select();
      return;
    }
    let imageId = null;
    if (pendingImageBlob) {
      try { imageId = await putImage(pendingImageBlob); }
      catch { showFormMessage("تعذر رفع الصورة إلى Google Drive."); return; }
    }
    const item = makeItem(name, imageId);
    activeItems().push(item);
    try {
      await saveSessions();
      clearPendingImage();
      nameInput.value = "";
      renderAll();
      showFormMessage(name ? `تمت إضافة ${name}.` : "تمت إضافة الصورة.", true);
      nameInput.focus();
    } catch (error) {
      const index = activeItems().findIndex((entry) => entry.id === item.id);
      if (index >= 0) activeItems().splice(index, 1);
      if (imageId) deleteImage(imageId).catch(() => undefined);
      renderAll();
      showFormMessage(error?.message || "تعذر حفظ العنصر.");
    }
  }

  async function removeItem(index, announce = true) {
    const items = activeItems();
    if (!cloudReady || cloudWriteCount > 0 || isSpinning || index < 0 || index >= items.length) return;
    const [removed] = items.splice(index, 1);
    renderAll();
    try {
      await saveSessions();
      if (removed.imageId) await deleteImage(removed.imageId);
      if (announce) showToast(`تم حذف ${displayName(removed, index)} من الجلسة.`);
    } catch (error) {
      items.splice(index, 0, removed);
      renderAll();
      showToast(error?.message || "تعذر حذف العنصر.");
    }
  }

  async function handleImageSelection(file) {
    if (!file || isProcessingImage) return;
    isProcessingImage = true;
    renderAll();
    showFormMessage("جارٍ تجهيز الصورة...", true);
    try {
      const blob = await normalizeImage(file);
      if (imageTargetIndex === null) {
        clearPendingImage();
        pendingImageBlob = blob;
        pendingImageUrl = URL.createObjectURL(blob);
        pendingImagePreview.src = pendingImageUrl;
        pendingImage.hidden = false;
        showFormMessage("الصورة جاهزة للإضافة.", true);
      } else {
        const item = activeItems()[imageTargetIndex];
        if (!item) throw new Error("لم يعد العنصر موجودًا.");
        const oldId = item.imageId;
        const newId = await putImage(blob);
        item.imageId = newId;
        try {
          await saveSessions();
        } catch (error) {
          item.imageId = oldId;
          await deleteImage(newId).catch(() => undefined);
          throw error;
        }
        if (oldId) await deleteImage(oldId).catch(() => undefined);
        ensureImage(newId);
        showToast(oldId ? "تم تحديث الصورة." : "تمت إضافة الصورة إلى العنصر.");
      }
    } catch (error) {
      showFormMessage(error?.message || "تعذر تجهيز الصورة.");
    } finally {
      isProcessingImage = false;
      imageTargetIndex = null;
      imageInput.value = "";
      renderAll();
    }
  }

  function switchSession(index) {
    if (!cloudReady || cloudWriteCount > 0 || isSpinning || index === activeSessionIndex || index < 0 || index > 2) return;
    rotations[activeSessionIndex] = rotation;
    activeSessionIndex = index;
    rotation = rotations[index];
    clearPendingImage();
    nameInput.value = "";
    selectedIndex = null;
    try { localStorage.setItem(ACTIVE_KEY, String(index)); } catch { /* session remains active */ }
    renderAll();
    showToast(`تم فتح ${SESSION_TITLES[index]}.`);
  }

  const easeOutQuint = (value) => 1 - Math.pow(1 - value, 5);

  function spin() {
    const items = activeItems();
    if (!cloudReady || cloudWriteCount > 0 || isSpinning) return;
    if (!items.length) { showToast("أضف اسمًا أو صورة قبل التدوير."); nameInput.focus(); return; }
    isSpinning = true;
    selectedIndex = randomInt(items.length);
    lastTickSegment = null;
    renderAll();
    wheelStage.classList.add("spinning");
    spinButton.querySelector(".primary-spin__label").textContent = "العجلة تدور...";
    const arc = TAU / items.length;
    const startRotation = rotation;
    const desired = normalizeAngle(-Math.PI / 2 - (selectedIndex + 0.5) * arc);
    const target = startRotation + (6 + randomInt(4)) * TAU + normalizeAngle(desired - normalizeAngle(startRotation));
    const duration = 5600 + randomInt(1200);
    const startedAt = performance.now();
    playStartSound();
    function animate(now) {
      const progress = Math.min((now - startedAt) / duration, 1);
      rotation = startRotation + (target - startRotation) * easeOutQuint(progress);
      drawWheel();
      playSegmentTick(arc, progress);
      if (progress < 1) requestAnimationFrame(animate);
      else {
        rotation = target;
        rotations[activeSessionIndex] = rotation;
        finishSpin();
      }
    }
    requestAnimationFrame(animate);
  }

  function finishSpin() {
    isSpinning = false;
    wheelStage.classList.remove("spinning");
    spinButton.querySelector(".primary-spin__label").textContent = "تدوير العجلة";
    renderAll();
    playWinSound();
    setTimeout(openWinnerModal, 260);
  }

  function openWinnerModal() {
    const item = activeItems()[selectedIndex];
    if (!item) return;
    winnerName.textContent = item.name || "الصورة المختارة";
    const cached = item.imageId ? (imageCache.get(item.imageId) || ensureImage(item.imageId)) : null;
    if (cached?.url) {
      winnerImage.src = cached.url;
      winnerImage.alt = item.name ? `صورة ${item.name}` : "الصورة المختارة";
      winnerImage.hidden = false;
    } else {
      winnerImage.hidden = true;
      winnerImage.removeAttribute("src");
    }
    winnerModal.hidden = false;
    document.body.style.overflow = "hidden";
    keepButton.focus();
    launchConfetti();
  }

  function closeWinnerModal() {
    winnerModal.hidden = true;
    document.body.style.overflow = "";
    if (confettiFrame) cancelAnimationFrame(confettiFrame);
    confettiFrame = null;
    celebrationCtx.clearRect(0, 0, celebrationCanvas.width, celebrationCanvas.height);
    winnerImage.hidden = true;
    selectedIndex = null;
    spinButton.focus();
  }

  function getAudioContext() {
    if (!soundEnabled) return null;
    if (!audioContext) {
      const AudioContextClass = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (AudioContextClass) audioContext = new AudioContextClass();
    }
    if (audioContext?.state === "suspended") audioContext.resume();
    return audioContext;
  }

  function tone(frequency, duration, volume = 0.035, type = "sine", delay = 0) {
    const ac = getAudioContext();
    if (!ac) return;
    const oscillator = ac.createOscillator();
    const gain = ac.createGain();
    const start = ac.currentTime + delay;
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(ac.destination);
    oscillator.start(start);
    oscillator.stop(start + duration);
  }

  function playStartSound() { tone(190, 0.18, 0.045, "triangle"); tone(285, 0.22, 0.03, "triangle", 0.08); }
  function playWinSound() { tone(523.25, 0.28, 0.045); tone(659.25, 0.3, 0.045, "sine", 0.12); tone(783.99, 0.5, 0.05, "sine", 0.24); }
  function playSegmentTick(arc, progress) {
    if (!soundEnabled || progress > 0.985) return;
    const segment = Math.floor(normalizeAngle(rotation + Math.PI / 2) / arc);
    if (segment !== lastTickSegment) {
      lastTickSegment = segment;
      tone(progress > 0.7 ? 520 : 430, 0.035, progress > 0.85 ? 0.018 : 0.012, "square");
    }
  }

  function launchConfetti() {
    const dpr = Math.min(globalThis.devicePixelRatio || 1, 2);
    celebrationCanvas.width = Math.round(innerWidth * dpr);
    celebrationCanvas.height = Math.round(innerHeight * dpr);
    celebrationCanvas.style.width = `${innerWidth}px`;
    celebrationCanvas.style.height = `${innerHeight}px`;
    const colors = ["#f7c75b", "#4ed8c6", "#7768ee", "#ff6b8b", "#ffffff"];
    const pieces = Array.from({ length: 90 }, (_, index) => ({
      x: innerWidth * (index % 2 ? 0.82 : 0.18) * dpr, y: innerHeight * 0.35 * dpr,
      vx: ((index % 2 ? -1 : 1) * (2.5 + Math.random() * 5)) * dpr,
      vy: (-7 - Math.random() * 8) * dpr, gravity: (0.22 + Math.random() * 0.12) * dpr,
      rotation: Math.random() * TAU, speed: (Math.random() - 0.5) * 0.22,
      width: (5 + Math.random() * 5) * dpr, height: (8 + Math.random() * 7) * dpr,
      color: colors[index % colors.length], opacity: 1
    }));
    const start = performance.now();
    function animate(now) {
      celebrationCtx.clearRect(0, 0, celebrationCanvas.width, celebrationCanvas.height);
      const age = now - start;
      pieces.forEach((piece) => {
        piece.x += piece.vx; piece.y += piece.vy; piece.vy += piece.gravity; piece.vx *= 0.994;
        piece.rotation += piece.speed; piece.opacity = Math.max(0, 1 - Math.max(0, age - 1700) / 900);
        celebrationCtx.save(); celebrationCtx.globalAlpha = piece.opacity;
        celebrationCtx.translate(piece.x, piece.y); celebrationCtx.rotate(piece.rotation);
        celebrationCtx.fillStyle = piece.color;
        celebrationCtx.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
        celebrationCtx.restore();
      });
      if (age < 2600 && !winnerModal.hidden) confettiFrame = requestAnimationFrame(animate);
    }
    confettiFrame = requestAnimationFrame(animate);
  }

  addForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (cloudReady && cloudWriteCount === 0 && !isSpinning) addItem(nameInput.value);
  });
  imagePickerButton.addEventListener("click", () => {
    if (!cloudReady || cloudWriteCount > 0 || isSpinning || isProcessingImage) return;
    imageTargetIndex = null; imageInput.value = ""; imageInput.click();
  });
  clearPendingImageButton.addEventListener("click", clearPendingImage);
  imageInput.addEventListener("change", () => { const file = imageInput.files?.[0]; if (file) handleImageSelection(file); });
  participantList.addEventListener("click", (event) => {
    const remove = event.target.closest("[data-delete-index]");
    if (remove) { removeItem(Number(remove.dataset.deleteIndex)); return; }
    const picture = event.target.closest("[data-image-index]");
    if (picture && cloudReady && cloudWriteCount === 0 && !isSpinning) {
      imageTargetIndex = Number(picture.dataset.imageIndex); imageInput.value = ""; imageInput.click();
    }
  });
  sessionTabs.forEach((tab) => tab.addEventListener("click", () => switchSession(Number(tab.dataset.session))));
  spinButton.addEventListener("click", spin);
  spinHub.addEventListener("click", spin);

  resetButton.addEventListener("click", async () => {
    const items = [...activeItems()];
    if (!cloudReady || cloudWriteCount > 0 || !items.length || isSpinning) return;
    if (confirm(`هل تريد حذف جميع محتويات ${SESSION_TITLES[activeSessionIndex]}؟`)) {
      sessions[activeSessionIndex].items = [];
      rotation = rotations[activeSessionIndex] = 0;
      renderAll();
      try {
        await saveSessions();
        await serverCall("deleteImages", items.map((item) => item.imageId).filter(Boolean));
        items.forEach((item) => releaseCachedImage(item.imageId));
        showToast("تمت إعادة ضبط الجلسة.");
      } catch (error) {
        sessions[activeSessionIndex].items = items;
        renderAll();
        showToast(error?.message || "تعذرت إعادة ضبط الجلسة.");
      }
    }
  });

  soundToggle.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    try { localStorage.setItem(SOUND_KEY, soundEnabled ? "on" : "off"); } catch { /* keep in memory */ }
    renderAll();
    if (soundEnabled) tone(660, 0.12, 0.025);
    showToast(soundEnabled ? "تم تشغيل الصوت." : "تم إيقاف الصوت.");
  });

  keepButton.addEventListener("click", closeWinnerModal);
  removeWinnerButton.addEventListener("click", async () => {
    if (selectedIndex === null) return;
    const index = selectedIndex;
    closeWinnerModal();
    await removeItem(index, false);
    showToast("تم حذف العنصر من الجولة القادمة.");
  });
  winnerModal.addEventListener("click", (event) => { if (event.target === winnerModal) closeWinnerModal(); });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !winnerModal.hidden) { closeWinnerModal(); return; }
    if (event.code === "Space" && winnerModal.hidden && document.activeElement !== nameInput) { event.preventDefault(); spin(); }
  });
  addEventListener("beforeunload", () => {
    if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
    imageCache.forEach((entry) => entry?.url?.startsWith("blob:") && URL.revokeObjectURL(entry.url));
  });
  if ("ResizeObserver" in globalThis) new ResizeObserver(resizeCanvas).observe(canvas);
  else addEventListener("resize", resizeCanvas);

  renderAll();
  requestAnimationFrame(resizeCanvas);
  loadCloudData();
})();
</script>
